[pytest]
asyncio_default_fixture_loop_scope = function
markers =
    e2e: live network integration test (requires SCRAPFLY_API_KEY)
    database: needs a local database (PostgreSQL under FABRIC_ENVIRONMENT=local, or SQL Server); excluded by default in CI
    spark: starts a local Spark session; needs a JVM (the spark_minimal dev container or a JDK 17)
    docs: documentation-consistency checks; may lag the code and are reported, not gating
