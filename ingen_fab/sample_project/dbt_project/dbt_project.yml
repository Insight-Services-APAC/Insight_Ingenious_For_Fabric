
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'dbt_project'
version: '1.0.0'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: '{project_name}'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

# Every run is logged by dbt itself: one row per run in dbt_batch and one per model and test in
# dbt_execution_log, in the log lakehouse. The macro lives in macros/ingen_fab_logging.sql and
# is maintained by ingen_fab (refreshed by every `ingen_fab dbt` command).
on-run-end:
  - "{{ ingen_fab_log_run(results) }}"
vars:
  log_lakehouse: lh_log

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


# Target lakehouses. With plain (not schema-enabled) lakehouses the adapter routes a model by its
# schema, which is the lakehouse name. The defaults are the project's silver and gold lakehouses;
# a run can point the same models elsewhere with --vars, which is how the notebook example writes
# to lh_silver_nb / lh_gold_nb without a second copy of the project. (The defaults are inline
# because dbt cannot read this file's own `vars:` block while rendering this file.)
models:
  dbt_project:
    # every incremental model is a Delta merge on its unique_key; set once here so the model
    # files carry no adapter-specific settings and are shared with dbt_warehouse
    +incremental_strategy: merge
    +file_format: delta
    silver:
      +materialized: table
      +schema: "{{ var('silver_lakehouse', 'lh_silver') }}"
    gold:
      +materialized: table
      +schema: "{{ var('gold_lakehouse', 'lh_gold') }}"
