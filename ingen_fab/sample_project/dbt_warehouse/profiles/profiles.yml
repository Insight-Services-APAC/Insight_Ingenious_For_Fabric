# Hand-written (ingen_fab generates profiles for the Spark adapter only). The SQL endpoint is
# not stored here: the notebook reads `wh_silver_warehouse_endpoint` from the Variable Library
# and exports it as DBT_WAREHOUSE_ENDPOINT, so the same file works in every environment.
{project_name}_warehouse:
  target: notebook
  outputs:
    # inside a Fabric Python notebook (dbtload_warehouse)
    notebook:
      type: fabric
      driver: ODBC Driver 18 for SQL Server
      server: "{{ env_var('DBT_WAREHOUSE_ENDPOINT') }}"
      database: wh_silver
      port: 1433
      schema: dbt_notebook
      authentication: fabricnotebook
      threads: 4

    # from a laptop with the Azure CLI login, for development
    laptop:
      type: fabric
      driver: ODBC Driver 18 for SQL Server
      server: "{{ env_var('DBT_WAREHOUSE_ENDPOINT') }}"
      database: wh_silver
      port: 1433
      schema: dbt_laptop
      authentication: CLI
      threads: 4
